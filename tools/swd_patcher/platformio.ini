; ESP32 → HT32F52243 SWD one-shot patcher for Qingping PM module
; Tested on a generic ESP32 DevKit-C (WROOM-32). Should work on any classic
; ESP32; for S2/S3/C3 adjust pin defines in src/main.cpp.

[env:esp32dev]
platform        = espressif32
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
build_flags     = -Os -Wall -Wextra
